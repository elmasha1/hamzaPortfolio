name: Keep the API awake

# Render's free tier stops a service after 15 minutes without traffic, and the
# next visitor then pays for the container to boot — tens of seconds before any
# content appears. A request every 10 minutes keeps it running, so the API is
# warm for whoever actually arrives.
#
# The budget works out: the free tier allows 750 instance-hours a month and a
# month is ~730 hours, so one always-on service fits.
#
# Two things to know about GitHub's scheduler: cron runs are best-effort and
# can be delayed under load, and scheduled workflows are disabled automatically
# after 60 days without a commit to the repository.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # lets you trigger it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        run: |
          curl --fail --silent --show-error \
               --max-time 90 \
               --retry 3 --retry-delay 10 --retry-connrefused \
               "${{ vars.API_HEALTH_URL || 'https://portfolio-api-153i.onrender.com/up' }}"
