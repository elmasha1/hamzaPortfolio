# Railway build plan for the Laravel API.
#
# Deliberately minimal: Railway's PHP provider already detects composer.json,
# serves public/ through nginx + php-fpm and binds $PORT. Overriding the start
# command would replace that with `artisan serve`, which is single-threaded and
# not what you want in front of real traffic.
#
# Migrations and cache warming run in the pre-deploy step instead — see
# railway.json — where the service's environment variables are available and a
# failure stops the release rather than half-deploying it.

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
]
